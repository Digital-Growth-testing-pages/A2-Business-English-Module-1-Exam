<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Business English A2 · Final Exam</title>
<style>
:root{
  --bg:#f4f6fb; --card:#fff; --text:#1a2233; --muted:#5b6b85;
  --border:#dde3ee; --accent:#2f6bff; --accent-soft:#e8efff;
  --good:#0f9d58; --good-soft:#e6f7ee; --bad:#d93025; --bad-soft:#fdeceb;
  --radius:14px; --shadow:0 1px 3px rgba(20,30,60,.06),0 8px 24px rgba(20,30,60,.05);
}
[data-theme="dark"]{
  --bg:#0d121b; --card:#161d2a; --text:#e8eefc; --muted:#93a1b8;
  --border:#263142; --accent:#5b8dff; --accent-soft:#1b2a4a;
  --good:#3ddc84; --good-soft:#0f2a1c; --bad:#ff6b5e; --bad-soft:#2e1512;
  --shadow:0 1px 3px rgba(0,0,0,.4);
}
*{box-sizing:border-box}
html,body{margin:0}
body{
  font-family:system-ui,-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
  background:var(--bg);color:var(--text);line-height:1.55;
  -webkit-font-smoothing:antialiased;
  transition:background .25s,color .25s;
}
.hidden{display:none !important}

/* Top bar */
.topbar{
  position:sticky;top:0;z-index:20;
  display:flex;align-items:center;justify-content:space-between;gap:16px;
  padding:12px 20px;background:var(--card);border-bottom:1px solid var(--border);
}
.brand{display:flex;align-items:center;gap:12px}
.badge{
  display:grid;place-items:center;width:42px;height:42px;border-radius:12px;
  background:var(--accent);color:#fff;font-weight:700;font-size:15px;letter-spacing:.5px;
}
.brand-title{font-weight:650;font-size:15px;line-height:1.2}
.brand-sub{font-size:12px;color:var(--muted)}
.tools{display:flex;align-items:center;gap:10px}
.timer{
  display:flex;align-items:center;gap:8px;padding:6px 10px 6px 14px;
  border:1px solid var(--border);border-radius:999px;font-variant-numeric:tabular-nums;
  font-weight:650;font-size:14px;background:var(--bg);
}
.timer.low{color:var(--bad);border-color:var(--bad)}
.icon-btn{
  border:1px solid var(--border);background:var(--card);color:var(--text);
  width:34px;height:34px;border-radius:9px;cursor:pointer;font-size:15px;
  display:grid;place-items:center;transition:.15s;
}
.icon-btn:hover{background:var(--accent-soft);border-color:var(--accent)}

/* Progress */
.progress{height:3px;background:var(--border)}
#progressBar{height:100%;width:0;background:var(--accent);transition:width .35s ease}

/* Section nav */
.secnav{
  display:flex;gap:8px;overflow-x:auto;padding:14px 20px 4px;
  max-width:980px;margin:0 auto;scrollbar-width:none;
}
.secnav::-webkit-scrollbar{display:none}
.pill{
  flex:0 0 auto;padding:7px 14px;border-radius:999px;border:1px solid var(--border);
  background:var(--card);color:var(--muted);font-size:13px;font-weight:550;cursor:pointer;
  transition:.15s;white-space:nowrap;
}
.pill:hover{border-color:var(--accent);color:var(--accent)}
.pill.active{background:var(--accent);border-color:var(--accent);color:#fff}
.pill.done::after{content:" ✓";font-weight:700}

/* Main */
main{max-width:980px;margin:0 auto;padding:14px 20px 60px}
.card{
  background:var(--card);border:1px solid var(--border);border-radius:var(--radius);
  box-shadow:var(--shadow);padding:26px 28px;animation:fade .25s ease;
}
@keyframes fade{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
.sec-head{display:flex;align-items:baseline;justify-content:space-between;gap:12px;margin-bottom:6px}
.sec-head h2{font-size:20px;margin:0;letter-spacing:-.2px}
.pts{
  flex:0 0 auto;font-size:12px;font-weight:700;color:var(--accent);
  background:var(--accent-soft);padding:4px 11px;border-radius:999px;
}
.intro{color:var(--muted);font-size:14px;margin:0 0 18px}
.passage{
  background:var(--bg);border:1px solid var(--border);border-left:3px solid var(--accent);
  border-radius:10px;padding:16px 18px;margin-bottom:22px;font-size:14.5px;
}
.passage h3{margin:0 0 8px;font-size:14px;letter-spacing:.4px;text-transform:uppercase;color:var(--muted)}
.passage p{margin:0 0 10px}
.passage p:last-child{margin:0}

/* Questions */
.qlist{display:flex;flex-direction:column;gap:6px}
.q{
  display:flex;gap:14px;padding:14px 12px;border-radius:10px;
  border-bottom:1px solid var(--border);
}
.q:last-child{border-bottom:none}
.qnum{
  flex:0 0 26px;height:26px;border-radius:50%;background:var(--accent-soft);color:var(--accent);
  display:grid;place-items:center;font-size:12.5px;font-weight:700;margin-top:2px;
}
.qbody{flex:1;min-width:0}
.sentence{font-size:15.5px;line-height:2.1}
.hint{color:var(--muted);font-size:13px;font-style:italic}
.blank{
  font:inherit;font-size:15px;font-weight:600;color:var(--accent);
  border:none;border-bottom:2px dashed var(--accent);background:transparent;
  padding:1px 6px;min-width:120px;outline:none;transition:.15s;
}
.blank:focus{background:var(--accent-soft);border-radius:5px 5px 0 0}
.blank.correct{border-bottom-color:var(--good);color:var(--good);background:var(--good-soft);border-radius:5px 5px 0 0}
.blank.wrong{border-bottom-color:var(--bad);color:var(--bad);background:var(--bad-soft);border-radius:5px 5px 0 0}

.row{display:flex;align-items:center;gap:8px;margin-top:8px;flex-wrap:wrap}
.feedback{font-size:13.5px;font-weight:600}
.feedback .ok{color:var(--good)}
.feedback .no{color:var(--bad)}
.note{font-weight:400;color:var(--muted);font-size:12.5px;margin-top:4px;line-height:1.5}
.alts{font-size:12.5px;color:var(--muted);margin-top:6px;line-height:1.6}
.alts b{color:var(--text);font-weight:600}

/* Buttons */
.btn{
  font:inherit;font-size:13px;font-weight:600;border-radius:9px;cursor:pointer;
  padding:7px 14px;border:1px solid var(--border);background:var(--card);color:var(--text);
  transition:.15s;
}
.btn:hover{border-color:var(--accent);color:var(--accent)}
.btn.small{padding:5px 11px;font-size:12.5px}
.btn.primary{background:var(--accent);border-color:var(--accent);color:#fff}
.btn.primary:hover{filter:brightness(1.08);color:#fff}
.btn.ghost{background:transparent}
.btn:disabled{opacity:.45;cursor:not-allowed}
.btn.override{border-color:var(--good);color:var(--good)}
.btn.override:hover{background:var(--good-soft)}

/* MCQ */
.options{display:flex;flex-direction:column;gap:8px;margin-top:10px}
.opt{
  text-align:left;font:inherit;font-size:14.5px;padding:11px 14px;
  border:1.5px solid var(--border);border-radius:10px;background:var(--card);
  color:var(--text);cursor:pointer;transition:.15s;
}
.opt:hover{border-color:var(--accent);background:var(--accent-soft)}
.opt.correct{border-color:var(--good);background:var(--good-soft);color:var(--good);font-weight:650}
.opt.wrong{border-color:var(--bad);background:var(--bad-soft);color:var(--bad)}
.opt.locked{cursor:default}
.opt.locked:hover{border-color:var(--border);background:var(--card)}
.opt.correct.locked:hover{border-color:var(--good);background:var(--good-soft)}
.opt.wrong.locked:hover{border-color:var(--bad);background:var(--bad-soft)}

/* Writing */
.wpart{margin:14px 0}
.wpart label{display:block;font-size:13px;font-weight:650;margin-bottom:6px;color:var(--muted)}
textarea{
  width:100%;min-height:110px;font:inherit;font-size:14.5px;padding:12px 14px;
  border:1.5px solid var(--border);border-radius:10px;background:var(--bg);color:var(--text);
  resize:vertical;outline:none;transition:.15s;line-height:1.6;
}
textarea:focus{border-color:var(--accent);background:var(--card)}
.wc{font-size:12px;color:var(--muted);margin-top:5px;text-align:right}
.wc.good{color:var(--good);font-weight:600}
.rubric{margin-top:22px;padding:16px;background:var(--bg);border-radius:10px;border:1px solid var(--border)}
.rubric-title{font-size:12px;font-weight:700;letter-spacing:.5px;text-transform:uppercase;color:var(--muted);margin-bottom:10px}
.rubric-item{display:flex;gap:10px;align-items:flex-start;padding:6px 0;font-size:14px;cursor:pointer}
.rubric-item input{margin-top:3px;accent-color:var(--accent);width:17px;height:17px;cursor:pointer}

/* Nav bar */
.navbar{
  display:flex;align-items:center;justify-content:space-between;gap:12px;
  margin-top:22px;
}
.nav-info{font-size:13px;color:var(--muted);font-weight:550}

/* Results */
.results{max-width:820px;margin:0 auto;padding:40px 20px 80px;animation:fade .35s ease}
.score-hero{
  text-align:center;background:var(--card);border:1px solid var(--border);
  border-radius:var(--radius);padding:38px 24px;box-shadow:var(--shadow);margin-bottom:22px;
}
.score-hero .big{font-size:56px;font-weight:800;letter-spacing:-2px;line-height:1;color:var(--accent)}
.score-hero .of{font-size:16px;color:var(--muted);margin-top:8px}
.score-hero .msg{margin-top:14px;font-size:15px;color:var(--muted)}
.bars{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);padding:22px;box-shadow:var(--shadow);margin-bottom:22px}
.bar-row{margin-bottom:14px}
.bar-row:last-child{margin-bottom:0}
.bar-label{display:flex;justify-content:space-between;font-size:13.5px;margin-bottom:6px}
.bar-label b{font-weight:650}
.bar-track{height:8px;background:var(--border);border-radius:999px;overflow:hidden}
.bar-fill{height:100%;border-radius:999px;background:var(--accent);transition:width .6s ease}
.review{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);padding:22px;box-shadow:var(--shadow)}
.review h3{margin:0 0 14px;font-size:15px}
.rv{display:flex;gap:12px;padding:10px 0;border-bottom:1px solid var(--border);font-size:13.5px}
.rv:last-child{border-bottom:none}
.rv .mark{flex:0 0 20px;font-weight:700}
.rv .mark.ok{color:var(--good)}
.rv .mark.no{color:var(--bad)}
.rv .txt{flex:1;color:var(--muted)}
.rv .txt b{color:var(--text);font-weight:600}
.res-actions{display:flex;gap:10px;justify-content:center;margin-top:24px;flex-wrap:wrap}

@media(max-width:640px){
  .card{padding:20px 16px}
  .topbar{padding:10px 14px}
  .brand-sub{display:none}
  .secnav{padding:12px 14px 2px}
  main{padding:12px 14px 50px}
  .q{gap:10px;padding:12px 6px}
  .sentence{font-size:14.5px;line-height:2}
  .score-hero .big{font-size:46px}
}
</style>
</head>
<body>

<header class="topbar">
  <div class="brand">
    <div class="badge">A2</div>
    <div>
      <div class="brand-title">Business English · Final Exam</div>
      <div class="brand-sub">Grammar · Reading · Writing · 55 points</div>
    </div>
  </div>
  <div class="tools">
    <div class="timer" id="timerBox">
      <span id="timeText">50:00</span>
      <button class="icon-btn" id="pauseBtn" title="Pause timer">⏸</button>
    </div>
    <button class="icon-btn" id="themeBtn" title="Toggle dark mode">🌙</button>
  </div>
</header>
<div class="progress"><div id="progressBar"></div></div>
<nav class="secnav" id="secnav"></nav>

<main id="app"></main>
<div id="results" class="results hidden"></div>

<script>
/* ============================================================
   EXAM DATA
   ============================================================ */
const SECTIONS = [
  {
    title: "Section 1 — Zero Conditionals",
    pts: 5,
    intro: "Complete each sentence with the correct form of the verb in brackets. This exercise practises the zero conditional.",
    questions: [
      { type:"text", pts:1, before:"If you mix red and blue, you", after:"purple.", hint:"(to get)",
        answers:["get","will get"], model:"get",
        note:"Zero conditional normally uses the present simple in both halves." },
      { type:"text", pts:1, before:"If you touch a hot stove, you", after:"your hand.", hint:"(to burn)",
        answers:["burn","will burn"], model:"burn" },
      { type:"text", pts:1, before:"If it rains, the ground", after:"wet.", hint:"(to turn)",
        answers:["turns","will turn"], model:"turns" },
      { type:"text", pts:1, before:"If you don't eat, you", after:"hungry.", hint:"(to go)",
        answers:["go","will go"], model:"go" },
      { type:"text", pts:1, before:"If you exercise regularly, you", after:"fit.", hint:"(to stay)",
        answers:["stay","will stay"], model:"stay" }
    ]
  },
  {
    title: "Section 2 — Second Conditionals",
    pts: 5,
    intro: "Complete each sentence with the correct form of the verb in brackets.",
    questions: [
      { type:"text", pts:1, before:"If I had a million dollars, I", after:"a luxury car.", hint:"(buy)",
        answers:["would buy","'d buy","i would buy","i'd buy"], model:"would buy" },
      { type:"text", pts:1, before:"If she were taller, she", after:"a professional basketball player.", hint:"(be)",
        answers:["would be","'d be","she would be","she'd be"], model:"would be" },
      { type:"text", pts:1, before:"If he had more time, he", after:"a novel.", hint:"(write)",
        answers:["would write","'d write","he would write","he'd write"], model:"would write" },
      { type:"text", pts:1, before:"If they won the lottery, they", after:"a world trip.", hint:"(take)",
        answers:["would take","'d take","they would take","they'd take"], model:"would take" },
      { type:"text", pts:1, before:"If you were the president, what", after:"?", hint:"(do)",
        answers:["would you do"], model:"would you do" }
    ]
  },
  {
    title: "Section 3 — Narrative Tenses",
    pts: 10,
    intro: "Complete each sentence with the correct narrative tense.",
    questions: [
      { type:"text", pts:1, before:"While I", after:"TV, the doorbell rang.", hint:"(watch)",
        answers:["was watching"], model:"was watching" },
      { type:"text", pts:1, before:"Yesterday, she", after:"a delicious cake.", hint:"(bake)",
        answers:["baked"], model:"baked" },
      { type:"text", pts:1, before:"When they arrived, the party", after:"already.", hint:"(start)",
        answers:["had started"], model:"had started" },
      { type:"text", pts:1, before:"While I", after:"a book, it started to rain.", hint:"(read)",
        answers:["was reading"], model:"was reading" },
      { type:"text", pts:1, before:"Last week, we", after:"on a trip to the mountains.", hint:"(go)",
        answers:["went"], model:"went" },
      { type:"text", pts:1, before:"While he", after:"dinner, the phone rang.", hint:"(prepare)",
        answers:["was preparing"], model:"was preparing" },
      { type:"text", pts:1, before:"When she opened the door, she", after:"a surprise.", hint:"(get)",
        answers:["got"], model:"got" },
      { type:"text", pts:1, before:"Last summer, they", after:"a concert in the park.", hint:"(attend)",
        answers:["attended"], model:"attended" },
      { type:"text", pts:1, before:"While I", after:"my homework, my friend called.", hint:"(do)",
        answers:["was doing"], model:"was doing" },
      { type:"text", pts:1, before:"Yesterday, we", after:"a movie at the cinema.", hint:"(watch)",
        answers:["watched"], model:"watched" }
    ]
  },
  {
    title: "Section 4 — Past Modals",
    pts: 8,
    intro: "Choose the correct past modal for each sentence.",
    questions: [
      { type:"mcq", pts:1,
        prompt:"She ___ left her phone at school. Or perhaps she left it on the bus.",
        options:["can't have","might have","must have"], answers:[1],
        note:'"Perhaps" signals uncertainty → might have.' },
      { type:"mcq", pts:1,
        prompt:"There's no pizza left. They ___ eaten it all.",
        options:["can't have","could have","must have"], answers:[2],
        note:"Strong logical deduction → must have." },
      { type:"mcq", pts:1,
        prompt:"Juliet ___ gone on holiday. She was at school yesterday!",
        options:["can't have","may have","must have"], answers:[0],
        note:"Impossible, because we have evidence she was at school → can't have." },
      { type:"mcq", pts:1,
        prompt:"I didn't get your email. Do you think you ___ sent it to my old email address?",
        options:["can't have","could have","must have"], answers:[1],
        note:"A possible explanation → could have." },
      { type:"mcq", pts:1,
        prompt:"Your smartwatch probably isn't broken. It ___ run out of charge.",
        options:["can't have","could have","must have"], answers:[2],
        note:"Probable explanation → must have." },
      { type:"mcq", pts:1,
        prompt:"The school show is on YouTube. Our teacher ___ uploaded it.",
        options:["can't have","might have","must have"], answers:[2],
        note:"Certain conclusion → must have." },
      { type:"mcq", pts:1,
        prompt:"You went 130 km in less than an hour? You ___ driven very fast!",
        options:["can't have","could have","must have"], answers:[2],
        note:"Certain conclusion → must have." },
      { type:"mcq", pts:1,
        prompt:"Max isn't replying to my texts. He ___ taken his phone with him.",
        options:["can't have","might have","must have"], answers:[0,1],
        note:"This one is genuinely ambiguous. The intended answer is \"can't have\" (if he had his phone he would reply), but \"might have\" is also defensible. Both are accepted." }
    ]
  },
  {
    title: "Section 5 — Reading Comprehension",
    pts: 10,
    intro: "Read the passage, then choose the correct answer for each question. (2.5 pts each)",
    passage: `<h3>The Amazing Inventions</h3>
      <p>Inventions have played a significant role in shaping the world we live in today. From simple tools to complex machinery, humans have always sought innovative ways to solve problems and improve their lives.</p>
      <p>One of the most influential inventions in history is the printing press. Invented by Johannes Gutenberg in the 15th century, the printing press revolutionized the way information was disseminated. It made books more accessible and affordable, leading to an increase in literacy rates and the spread of knowledge.</p>
      <p>Another remarkable invention is the telephone, invented by Alexander Graham Bell in the late 19th century. The telephone enabled people to communicate over long distances, making the world feel smaller and bringing people closer together. Today, we can't imagine our lives without smartphones, which are essentially portable telephones that have expanded our communication capabilities even further.</p>
      <p>The 20th century brought about the invention of the internet, which has completely transformed our world. With the internet, information is just a click away, and people from different corners of the globe can connect with each other instantly. It has revolutionized industries, such as education, business, and entertainment, and has opened up new opportunities in various fields.</p>`,
    questions: [
      { type:"mcq", pts:2.5, prompt:"Who invented the printing press?",
        options:["Alexander Graham Bell","Johannes Gutenberg","Thomas Edison","Isaac Newton"], answers:[1] },
      { type:"mcq", pts:2.5, prompt:"When was the printing press invented?",
        options:["15th century","18th century","19th century","20th century"], answers:[0] },
      { type:"mcq", pts:2.5, prompt:"How did the telephone revolutionize communication?",
        options:["By making books more accessible","By enabling long-distance communication","By inventing smartphones","By increasing literacy rates"], answers:[1] },
      { type:"mcq", pts:2.5, prompt:"Which industries have been revolutionized by the internet?",
        options:["Agriculture and transportation","Education, business, and entertainment","Healthcare and fashion","Construction and manufacturing"], answers:[1] }
    ]
  },
  {
    title: "Section 6 — Telephone Phrases",
    pts: 5,
    intro: "Write a suitable phrase for each telephone function. Answers will be checked against keywords — use the \"Mark as correct\" button if your answer is valid but the checker misses it.",
    questions: [
      { type:"open", pts:1, prompt:"Answering the phone",
        keywords:["hello","speaking","good morning","good afternoon","how can i help","how may i help"],
        model:"Hello, this is Maria speaking.",
        alts:["Good morning, [company]. How can I help you?","Hello?"] },
      { type:"open", pts:1, prompt:"Asking and making requests",
        keywords:["could","can i","would you","please","may i"],
        model:"Could you please hold for a moment?",
        alts:["Can I speak to Mr Smith, please?","Would you mind repeating that?"] },
      { type:"open", pts:1, prompt:"Going away from the phone",
        keywords:["hold","moment","second","wait"],
        model:"Could you hold on a moment, please?",
        alts:["Just a second, please.","Please hold."] },
      { type:"open", pts:1, prompt:"Not understanding what someone said",
        keywords:["repeat","again","catch","say that"],
        model:"Sorry, could you repeat that, please?",
        alts:["I'm sorry, I didn't catch that.","Could you say that again?"] },
      { type:"open", pts:1, prompt:"Ending the call",
        keywords:["bye","goodbye","thank you for calling","speak to you"],
        model:"Thank you for calling. Goodbye.",
        alts:["I'll speak to you soon. Bye.","Thanks for your call. Have a good day."] }
    ]
  },
  {
    title: "Section 7 — Writing",
    pts: 12,
    intro: "Write a reply to an unsatisfied customer. The customer ordered a package that arrived late and contained the wrong item. Choose to offer either a refund or a replacement. Write a 50-word complaint from the customer and a 50-word reply from the company.",
    questions: [
      { type:"writing", pts:12,
        parts:[
          { label:"Customer complaint (about 50 words)", min:50 },
          { label:"Company reply (about 50 words)", min:50 }
        ],
        rubric:[
          "The complaint clearly says the package arrived late.",
          "The complaint clearly says the wrong item was delivered.",
          "The complaint is about 50 words.",
          "The reply offers either a refund or a replacement.",
          "The reply is polite and about 50 words.",
          "Both messages use an email format (greeting, body, closing)."
        ] }
    ]
  }
];

/* ============================================================
   STATE
   ============================================================ */
const state = {
  current: 0,
  answers: {},      // key -> { value, correct, checked }
  writing: {},      // "key-part" -> text
  rubric: {},       // "key-ri" -> bool
  finished: false,
  timeLeft: 50 * 60,
  running: true
};

/* ============================================================
   HELPERS
   ============================================================ */
function norm(s){
  return (s || "").toLowerCase()
    .replace(/[’‘`]/g, "'")
    .replace(/'/g, "")
    .replace(/[.,!?;:"“”()]/g, "")
    .replace(/\s+/g, " ")
    .trim();
}
function getQ(key){
  const [si, qi] = key.split("-").map(Number);
  return SECTIONS[si].questions[qi];
}
function totalGradable(){
  let n = 0;
  SECTIONS.forEach(s => s.questions.forEach(q => { if(q.type !== "writing") n++; }));
  return n + 1; // writing counted as one block
}
function answeredCount(){
  let n = 0;
  SECTIONS.forEach((s, si) => {
    s.questions.forEach((q, qi) => {
      const key = si + "-" + qi;
      if(q.type === "writing"){
        if(state.writing[key + "-0"] || state.writing[key + "-1"]) n++;
      } else {
        const a = state.answers[key];
        if(a && a.checked) n++;
      }
    });
  });
  return n;
}

/* ============================================================
   RENDER
   ============================================================ */
const app = document.getElementById("app");
const resultsEl = document.getElementById("results");
const secnav = document.getElementById("secnav");

function renderNav(){
  secnav.innerHTML = SECTIONS.map((s, i) => {
    const short = s.title.replace(/^Section \d+ — /, "");
    const done = sectionDone(i);
    return `<button class="pill ${i===state.current?"active":""} ${done?"done":""}" data-nav="${i}">${short}</button>`;
  }).join("");
}
function sectionDone(i){
  const s = SECTIONS[i];
  return s.questions.every((q, qi) => {
    const key = i + "-" + qi;
    if(q.type === "writing") return !!(state.writing[key+"-0"] || state.writing[key+"-1"]);
    const a = state.answers[key];
    return a && a.checked;
  });
}
function updateProgress(){
  const pct = Math.round((answeredCount() / totalGradable()) * 100);
  document.getElementById("progressBar").style.width = pct + "%";
  renderNav();
}

function renderQuestion(s, q, qi, si){
  const key = si + "-" + qi;
  if(q.type === "text" || q.type === "open"){
    const a = state.answers[key] || {};
    const val = a.value || "";
    const cls = a.checked ? (a.correct ? "correct" : "wrong") : "";
    let altsHtml = "";
    if(a.checked){
      const accepted = q.type === "text"
        ? q.answers.filter(x => norm(x) !== norm(q.model)).slice(0,3).map(x => x.replace(/'/g,"'"))
        : (q.alts || []);
      if(accepted.length){
        altsHtml = `<div class="alts"><b>${q.type==="text"?"Also accepted":"Other good answers"}:</b> ${accepted.join(" · ")}</div>`;
      }
    }
    return `<div class="q" data-key="${key}">
      <div class="qnum">${qi+1}</div>
      <div class="qbody">
        <div class="sentence">${q.before ? q.before + " " : ""}${q.before ? `<input class="blank ${cls}" data-key="${key}" value="${escapeAttr(val)}" autocomplete="off" spellcheck="false">` : ""}${q.after ? " " + q.after : ""}${q.hint ? ` <span class="hint">${q.hint}</span>` : ""}${!q.before ? `<input class="blank ${cls}" data-key="${key}" value="${escapeAttr(val)}" autocomplete="off" spellcheck="false" style="min-width:240px">` : ""}</div>
        <div class="row">
          <button class="btn small" data-check="${key}">Check</button>
          <button class="btn small ghost" data-show="${key}">Show answer</button>
          ${a.checked && !a.correct ? `<button class="btn small override" data-override="${key}">Mark as correct ✓</button>` : ""}
          <span class="feedback">${a.checked ? (a.correct ? '<span class="ok">✓ Correct</span>' : '<span class="no">✗ Not quite</span>') : ""}</span>
        </div>
        ${a.checked && a.correct && q.note ? `<div class="note">${q.note}</div>` : ""}
        ${altsHtml}
      </div>
    </div>`;
  }
  if(q.type === "mcq"){
    const a = state.answers[key];
    const locked = a && a.checked;
    return `<div class="q" data-key="${key}">
      <div class="qnum">${qi+1}</div>
      <div class="qbody">
        <div class="sentence">${q.prompt}</div>
        <div class="options">
          ${q.options.map((o, oi) => {
            let cls = "";
            if(locked){
              if(q.answers.includes(oi)) cls = "correct locked";
              else if(a.value === oi) cls = "wrong locked";
              else cls = "locked";
            }
            return `<button class="opt ${cls}" data-mcq="${key}" data-opt="${oi}">${String.fromCharCode(97+oi)}) ${o}</button>`;
          }).join("")}
        </div>
        ${locked && q.note ? `<div class="note">${q.note}</div>` : ""}
        ${locked && a.correct ? `<div class="feedback" style="margin-top:6px"><span class="ok">✓ Correct</span></div>` : ""}
      </div>
    </div>`;
  }
  if(q.type === "writing"){
    return `<div class="q" data-key="${key}">
      <div class="qnum">${qi+1}</div>
      <div class="qbody">
        <div class="sentence" style="line-height:1.6">${q.prompt}</div>
        ${q.parts.map((p, pi) => {
          const val = state.writing[key + "-" + pi] || "";
          const words = countWords(val);
          const ok = words >= p.min - 10;
          return `<div class="wpart">
            <label>${p.label}</label>
            <textarea data-writing="${key}-${pi}" placeholder="Write here...">${escapeHtml(val)}</textarea>
            <div class="wc ${ok?"good":""}" data-wc="${key}-${pi}">${words} words${ok?" ✓":""}</div>
          </div>`;
        }).join("")}
        <div class="rubric">
          <div class="rubric-title">Marking checklist · 2 pts each</div>
          ${q.rubric.map((r, ri) => {
            const checked = state.rubric[key + "-" + ri] ? "checked" : "";
            return `<label class="rubric-item"><input type="checkbox" data-rubric="${key}-${ri}" ${checked}><span>${r}</span></label>`;
          }).join("")}
        </div>
      </div>
    </div>`;
  }
  return "";
}
function escapeAttr(s){ return String(s).replace(/&/g,"&amp;").replace(/"/g,"&quot;").replace(/</g,"&lt;"); }
function escapeHtml(s){ return String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;"); }
function countWords(s){
  const t = (s || "").trim();
  if(!t) return 0;
  return t.split(/\s+/).length;
}

function render(){
  const si = state.current;
  const s = SECTIONS[si];
  let html = `<section class="card">
    <div class="sec-head"><h2>${s.title}</h2><span class="pts">${s.pts} pts</span></div>
    <p class="intro">${s.intro}</p>`;
  if(s.passage) html += `<div class="passage">${s.passage}</div>`;
  html += `<div class="qlist">`;
  s.questions.forEach((q, qi) => { html += renderQuestion(s, q, qi, si); });
  html += `</div></section>`;

  const last = si === SECTIONS.length - 1;
  html += `<div class="navbar">
    <button class="btn ghost" id="prevBtn" ${si===0?"disabled":""}>← Back</button>
    <span class="nav-info">Section ${si+1} of ${SECTIONS.length}</span>
    ${last
      ? `<button class="btn primary" id="finishBtn">Finish exam ✓</button>`
      : `<button class="btn primary" id="nextBtn">Next →</button>`}
  </div>`;

  app.innerHTML = html;
  bindSectionEvents(si);
  updateProgress();
}

function bindSectionEvents(si){
  const s = SECTIONS[si];

  // text inputs
  app.querySelectorAll("input.blank").forEach(inp => {
    inp.addEventListener("input", e => {
      const key = e.target.dataset.key;
      state.answers[key] = Object.assign({}, state.answers[key], { value: e.target.value });
    });
    inp.addEventListener("keydown", e => {
      if(e.key === "Enter"){ e.preventDefault(); checkText(e.target.dataset.key); }
    });
  });

  // textareas
  app.querySelectorAll("textarea[data-writing]").forEach(ta => {
    ta.addEventListener("input", e => {
      const id = e.target.dataset.writing;
      state.writing[id] = e.target.value;
      const wc = app.querySelector('[data-wc="' + id + '"]');
      if(wc){
        const q = s.questions[0];
        const pi = Number(id.split("-").pop());
        const min = q.parts[pi].min;
        const words = countWords(e.target.value);
        wc.textContent = words + " words" + (words >= min - 10 ? " ✓" : "");
        wc.classList.toggle("good", words >= min - 10);
      }
      updateProgress();
    });
  });

  // rubric
  app.querySelectorAll("input[data-rubric]").forEach(cb => {
    cb.addEventListener("change", e => {
      state.rubric[e.target.dataset.rubric] = e.target.checked;
    });
  });

  // prev / next / finish
  const prev = document.getElementById("prevBtn");
  if(prev) prev.addEventListener("click", () => { if(state.current > 0){ state.current--; render(); } });
  const next = document.getElementById("nextBtn");
  if(next) next.addEventListener("click", () => { if(state.current < SECTIONS.length-1){ state.current++; render(); } });
  const fin = document.getElementById("finishBtn");
  if(fin) fin.addEventListener("click", finish);
}

/* ============================================================
   ANSWER CHECKING
   ============================================================ */
function checkText(key){
  const q = getQ(key);
  const inp = app.querySelector('input[data-key="' + key + '"]');
  if(!inp) return;
  const val = inp.value;
  let correct;
  if(q.type === "open"){
    correct = q.keywords.some(k => new RegExp("\\b" + k.replace(/[.*+?^${}()|[\]\\]/g, "\\$&") + "\\b", "i").test(val));
  } else {
    correct = q.answers.some(a => norm(a) === norm(val));
  }
  state.answers[key] = { value: val, correct, checked: true };
  inp.classList.remove("correct","wrong");
  inp.classList.add(correct ? "correct" : "wrong");
  // Re-render just this question body's feedback area
  refreshQuestionFeedback(key);
  updateProgress();
}

function refreshQuestionFeedback(key){
  const q = getQ(key);
  const el = app.querySelector('.q[data-key="' + key + '"]');
  if(!el) return;
  const a = state.answers[key] || {};
  const row = el.querySelector(".row");
  if(!row) return;
  // rebuild feedback area
  const fb = row.querySelector(".feedback");
  if(fb) fb.innerHTML = a.checked ? (a.correct ? '<span class="ok">✓ Correct</span>' : '<span class="no">✗ Not quite</span>') : "";
  // remove old override
  const oldOv = row.querySelector("[data-override]");
  if(oldOv) oldOv.remove();
  if(a.checked && !a.correct){
    const btn = document.createElement("button");
    btn.className = "btn small override";
    btn.dataset.override = key;
    btn.textContent = "Mark as correct ✓";
    row.insertBefore(btn, fb);
  }
  // alts
  let alts = el.querySelector(".alts");
  if(alts) alts.remove();
  if(a.checked){
    const accepted = q.type === "text"
      ? q.answers.filter(x => norm(x) !== norm(q.model)).slice(0,3)
      : (q.alts || []);
    if(accepted.length){
      const d = document.createElement("div");
      d.className = "alts";
      d.innerHTML = `<b>${q.type==="text"?"Also accepted":"Other good answers"}:</b> ` + accepted.join(" · ");
      el.querySelector(".qbody").appendChild(d);
    }
  }
  // note if correct
  const oldNote = el.querySelector(".note");
  if(oldNote) oldNote.remove();
  if(a.checked && a.correct && q.note){
    const n = document.createElement("div");
    n.className = "note";
    n.textContent = q.note;
    el.querySelector(".qbody").appendChild(n);
  }
}

/* ============================================================
   EVENT DELEGATION
   ============================================================ */
document.addEventListener("click", e => {
  // nav pills
  const nav = e.target.closest("[data-nav]");
  if(nav){ state.current = Number(nav.dataset.nav); render(); return; }

  // check
  const chk = e.target.closest("[data-check]");
  if(chk){ checkText(chk.dataset.check); return; }

  // show answer
  const show = e.target.closest("[data-show]");
  if(show){
    const key = show.dataset.show;
    const q = getQ(key);
    const inp = app.querySelector('input[data-key="' + key + '"]');
    if(inp){ inp.value = q.model; inp.classList.remove("wrong","correct"); inp.classList.add("correct"); }
    state.answers[key] = { value: q.model, correct: true, checked: true };
    refreshQuestionFeedback(key);
    updateProgress();
    return;
  }

  // override
  const ov = e.target.closest("[data-override]");
  if(ov){
    const key = ov.dataset.override;
    if(state.answers[key]) state.answers[key].correct = true;
    const inp = app.querySelector('input[data-key="' + key + '"]');
    if(inp){ inp.classList.remove("wrong"); inp.classList.add("correct"); }
    refreshQuestionFeedback(key);
    updateProgress();
    return;
  }

  // mcq
  const opt = e.target.closest("[data-mcq]");
  if(opt){
    const key = opt.dataset.mcq;
    const q = getQ(key);
    const existing = state.answers[key];
    if(existing && existing.checked) return; // locked
    const oi = Number(opt.dataset.opt);
    const correct = q.answers.includes(oi);
    state.answers[key] = { value: oi, correct, checked: true };
    // re-render this question
    const el = app.querySelector('.q[data-key="' + key + '"]');
    const si = state.current;
    const qi = Number(key.split("-")[1]);
    const tmp = document.createElement("div");
    tmp.innerHTML = renderQuestion(SECTIONS[si], q, qi, si);
    el.replaceWith(tmp.firstElementChild);
    updateProgress();
    return;
  }
});

/* ============================================================
   TIMER
   ============================================================ */
const timerBox = document.getElementById("timerBox");
const timeText = document.getElementById("timeText");
const pauseBtn = document.getElementById("pauseBtn");
function tick(){
  if(!state.running || state.finished) return;
  state.timeLeft--;
  if(state.timeLeft <= 0){
    state.timeLeft = 0;
    state.running = false;
    renderTime();
    finish();
    return;
  }
  renderTime();
}
function renderTime(){
  const m = Math.floor(state.timeLeft / 60);
  const s = state.timeLeft % 60;
  timeText.textContent = String(m).padStart(2,"0") + ":" + String(s).padStart(2,"0");
  timerBox.classList.toggle("low", state.timeLeft <= 300);
}
pauseBtn.addEventListener("click", () => {
  state.running = !state.running;
  pauseBtn.textContent = state.running ? "⏸" : "▶";
});
setInterval(tick, 1000);
renderTime();

/* ============================================================
   THEME
   ============================================================ */
document.getElementById("themeBtn").addEventListener("click", () => {
  const html = document.documentElement;
  const next = html.dataset.theme === "dark" ? "light" : "dark";
  html.dataset.theme = next;
  document.getElementById("themeBtn").textContent = next === "dark" ? "☀️" : "🌙";
});

/* ============================================================
   FINISH + RESULTS
   ============================================================ */
function finish(){
  state.finished = true;
  state.running = false;

  let earned = 0, total = 0;
  const rows = [];

  SECTIONS.forEach((s, si) => {
    let sEarn = 0, sTot = 0;
    s.questions.forEach((q, qi) => {
      const key = si + "-" + qi;
      if(q.type === "writing"){
        const rTot = q.rubric.length * 2;
        let rEarn = 0;
        q.rubric.forEach((_, ri) => { if(state.rubric[key + "-" + ri]) rEarn += 2; });
        sEarn += rEarn; sTot += rTot;
      } else {
        sTot += q.pts;
        const a = state.answers[key];
        if(a && a.correct) sEarn += q.pts;
      }
    });
    rows.push({ title: s.title, earn: sEarn, tot: sTot });
    earned += sEarn; total += sTot;
  });

  const pct = Math.round((earned / total) * 100);
  let msg;
  if(pct >= 90) msg = "Outstanding — near-perfect work.";
  else if(pct >= 75) msg = "Strong result. A few details to polish.";
  else if(pct >= 60) msg = "A solid pass. Review the sections below.";
  else if(pct >= 40) msg = "Keep going — use the review to target the gaps.";
  else msg = "Plenty to work on. Review each section carefully.";

  let html = `<div class="score-hero">
    <div class="big">${formatNum(earned)}</div>
    <div class="of">out of ${total} points · ${pct}%</div>
    <div class="msg">${msg}</div>
  </div>
  <div class="bars">`;
  rows.forEach(r => {
    const p = Math.round((r.earn / r.tot) * 100);
    html += `<div class="bar-row">
      <div class="bar-label"><b>${r.title}</b><span>${formatNum(r.earn)} / ${r.tot}</span></div>
      <div class="bar-track"><div class="bar-fill" style="width:${p}%"></div></div>
    </div>`;
  });
  html += `</div>
  <div class="review">
    <h3>Review</h3>`;

  SECTIONS.forEach((s, si) => {
    s.questions.forEach((q, qi) => {
      const key = si + "-" + qi;
      if(q.type === "writing"){
        const rTot = q.rubric.length * 2;
        let rEarn = 0;
        q.rubric.forEach((_, ri) => { if(state.rubric[key + "-" + ri]) rEarn += 2; });
        html += `<div class="rv">
          <span class="mark ${rEarn >= rTot/2 ? "ok" : "no"}">${rEarn >= rTot/2 ? "✓" : "✗"}</span>
          <span class="txt"><b>Writing</b> — ${formatNum(rEarn)} / ${rTot} pts (teacher checklist)</span>
        </div>`;
        return;
      }
      const a = state.answers[key];
      const ok = a && a.correct;
      let detail = "";
      if(q.type === "mcq"){
        detail = "Correct answer: <b>" + q.answers.map(i => q.options[i]).join(" / ") + "</b>";
        if(a) detail += " · Your answer: " + q.options[a.value];
      } else {
        detail = "Model answer: <b>" + escapeHtml(q.model || "") + "</b>";
        if(a && a.value) detail += " · Your answer: " + escapeHtml(a.value);
      }
      html += `<div class="rv">
        <span class="mark ${ok ? "ok" : "no"}">${ok ? "✓" : "✗"}</span>
        <span class="txt"><b>${escapeHtml(s.title.replace(/^Section \d+ — /, ""))} · Q${qi+1}</b> — ${detail}</span>
      </div>`;
    });
  });

  html += `</div>
  <div class="res-actions">
    <button class="btn" onclick="location.reload()">Retake full exam</button>
    <button class="btn primary" onclick="window.print()">Print results</button>
  </div>`;

  resultsEl.innerHTML = html;
  resultsEl.classList.remove("hidden");
  app.classList.add("hidden");
  document.querySelector(".secnav").classList.add("hidden");
  document.querySelector(".progress").classList.add("hidden");
  window.scrollTo(0,0);
}
function formatNum(n){
  return Number.isInteger(n) ? n : n.toFixed(1);
}

/* ============================================================
   INIT
   ============================================================ */
render();
renderNav();
updateProgress();
</script>
</body>
</html>
